name: Verify published frontend efficiency bytes
on:
  push:
    branches: [verify/frontend-workflow-efficiency-release]
permissions:
  contents: read
  actions: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Wait for the exact authorized Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 45); do
            STATE=$(gh api repos/jspusa/AMZ.API/actions/runs/34495394621 --jq '.status + ":" + (.conclusion // "pending")')
            echo "Pages run 34495394621: $STATE"
            if [ "$STATE" = "completed:success" ]; then exit 0; fi
            if [[ "$STATE" == completed:* ]]; then exit 1; fi
            sleep 10
          done
          echo "Exact Pages deployment did not complete." >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages
          run-id: 34495394621
          github-token: ${{ github.token }}
      - name: Extract the published artifact without rebuilding
        run: |
          mkdir expected
          tar -xf pages/artifact.tar -C expected
      - name: Verify default website document and every JS and CSS asset
        env:
          RELEASE_SHA: 283d36c8182dd3ba14f02426361f8dc20520d3ad
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,readdir,mkdir} from 'node:fs/promises';
          import {resolve,relative} from 'node:path';
          import {createHash} from 'node:crypto';
          const sha=process.env.RELEASE_SHA;
          assert.match(sha,/^[a-f0-9]{40}$/u);
          const root=resolve('expected'),base='https://jspusa.github.io/AMZ.API/';
          const digest=b=>createHash('sha256').update(b).digest('hex');
          const expectedIndex=await readFile(resolve(root,'index.html'));
          async function fetchBytes(url){
            const r=await fetch(url,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,`Unexpected HTTP ${r.status} at ${url}`);
            return Buffer.from(await r.arrayBuffer());
          }
          async function matchPublished(path,expected){
            let last;
            for(let attempt=0;attempt<12;attempt++){
              try{
                const actual=await fetchBytes(new URL(path,base));
                assert.equal(digest(actual),digest(expected),`Published bytes differ: ${path||'index.html'}`);
                return actual;
              }catch(error){last=error;if(attempt<11)await new Promise(r=>setTimeout(r,15000));}
            }
            throw last;
          }
          const index=await matchPublished('',expectedIndex);
          const html=index.toString('utf8');
          const entry=html.match(/<script[^>]+src="\.\/([^"]+\.js)"/u)?.[1];
          assert.ok(entry,'Missing emitted entry script');
          const entryText=await readFile(resolve(root,entry),'utf8');
          assert.ok(entryText.includes(sha),'UI metadata does not contain the merged release SHA');
          assert.ok(entryText.includes('網頁介面版本'));
          assert.ok(entryText.includes('批次 SKU'));
          async function walk(dir){
            const paths=[];
            for(const item of await readdir(dir,{withFileTypes:true})){
              const path=resolve(dir,item.name);
              if(item.isDirectory())paths.push(...await walk(path));
              else if(/\.(?:js|css)$/u.test(item.name))paths.push(path);
            }
            return paths;
          }
          const files=await walk(resolve(root,'assets'));
          assert.ok(files.length>=2,'Expected emitted JS and CSS');
          const assets=[];
          for(const path of files){
            const name=relative(root,path).split('\\').join('/');
            const expected=await readFile(path);const actual=await matchPublished(name,expected);
            assets.push({name,bytes:actual.length,sha256:digest(actual)});
          }
          await mkdir('public-proof',{recursive:true});
          const report={verified:true,release:sha,checkedAt:new Date().toISOString(),defaultIndexVerified:true,indexSha256:digest(index),matchedAssetCount:assets.length,entry,assets,scope:'Public Pages GET verification only; no Notebook Key, credentials or Amazon account accessed.'};
          await writeFile('public-proof/published-byte-verification.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Preserve public-byte evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-efficiency-public-proof
          path: public-proof
          retention-days: 5
