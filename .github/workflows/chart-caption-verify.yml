name: Final chart caption readability verification
on:
  push:
    branches: [fix/compact-charts-dark-readability]
    paths: [.github/workflows/chart-caption-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply exact caption spacing fix and its geometry regression
        run: |
          mkdir -p caption-evidence
          python3 - <<'PY'
          import hashlib, pathlib
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          path=pathlib.Path('src/renderer/src/components/sales-trend-chart.tsx')
          assert blob(path.read_bytes()) == '75a7e7014e283399512fda01dbe00ffd467773a0'
          text=path.read_text()
          old='const plotTop = skaterEnabled ? PLOT.top : 20;'
          assert text.count(old)==1
          path.write_text(text.replace(old,'const plotTop = skaterEnabled ? PLOT.top : 38;'))
          assert blob(path.read_bytes()) == '33018a693a3a773713a1486fd7b8374d5562b9a7'
          path=pathlib.Path('scripts/visual-qa/compact-charts-check.mjs')
          assert blob(path.read_bytes()) == '61d1aefc0c65acd4969447fa474912e299c7ca24'
          text=path.read_text()
          needle="      const pie=await page.locator('.brand-sales-pie-wrap').boundingBox();assert.ok(pie.width<=72);"
          addition='''      const captionGap=await page.locator(".sales-trend-plot svg").evaluate(svg=>{
                  const currency=svg.querySelector(".sales-trend-axis-currency").getBoundingClientRect();
                  const ticks=[...svg.querySelectorAll(".sales-trend-gridline text")].map(t=>t.getBoundingClientRect());
                  return Math.min(...ticks.map(t=>t.top))-currency.bottom;
                });
                assert.ok(captionGap>=2,`Currency caption must not touch the top axis tick: ${width} ${font} ${captionGap}`);
          '''
          addition='\n'.join(line[10:] if line.startswith('          ') else line for line in addition.split('\n'))
          assert text.count(needle)==1
          path.write_text(text.replace(needle,addition+needle))
          assert blob(path.read_bytes()) == '622b2b11edc86209d38451236f86739bfebe70f6'
          PY
          git add src/renderer/src/components/sales-trend-chart.tsx scripts/visual-qa/compact-charts-check.mjs
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Production audit
        run: npm audit --omit=dev > caption-evidence/audit.txt
      - name: Typecheck tests and build
        run: npm run check > caption-evidence/check.txt 2>&1
      - name: Synthetic loopback browser verification
        run: |
          npm install --prefix /tmp/chart-browser --no-save --ignore-scripts playwright@1.55.1
          APPEARANCE_PLAYWRIGHT=/tmp/chart-browser/node_modules/playwright/index.mjs node scripts/visual-qa/appearance-check.mjs > caption-evidence/browser.txt 2>&1
      - name: Store exact verified blobs
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('fs');
            const paths=['src/renderer/src/components/sales-trend-chart.tsx','scripts/visual-qa/compact-charts-check.mjs'];
            const entries=[];
            for(const path of paths){
              const content=fs.readFileSync(path);
              const r=await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'});
              entries.push({path,mode:'100644',type:'blob',sha:r.data.sha});
            }
            fs.writeFileSync('caption-evidence/tree.json',JSON.stringify({verifiedSource:context.sha,entries},null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-caption-verification
          path: |
            caption-evidence
            out/renderer
            appearance-evidence
          retention-days: 1
