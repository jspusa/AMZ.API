name: Release publisher-signed desktop apps

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "::error::Tag must equal $expected"; exit 1; }
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA" || { echo "::error::Tag and workflow SHA do not match."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Desktop releases must come from main."; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Validate shared source
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev

  mac:
    needs: quality
    runs-on: macos-15-intel
    timeout-minutes: 90
    environment: mac-release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate macOS signing secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "::error::Missing protected secret: $key"; exit 1; }
          done
      - name: Install locked dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Build signed macOS update
        run: >
          npx --no-install electron-builder
          --mac dmg zip
          --universal
          --publish never
          -c.forceCodeSigning=true
          -c.mac.notarize=true
          -c.extraMetadata.amzApiUpdateChannel=publisher-signed-v1
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify signature, notarization, architectures and update metadata
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name 'AMZ.API.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          lipo -info "$app_path/Contents/MacOS/$executable" | tee /tmp/amz-api-lipo-result
          grep -q x86_64 /tmp/amz-api-lipo-result
          grep -q arm64 /tmp/amz-api-lipo-result
          test -f release/latest-mac.yml
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"
      - name: Record macOS checksums
        shell: bash
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-macOS.txt
      - name: Upload verified macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate Windows signing secrets
        shell: powershell
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("WIN_CSC_LINK", "WIN_CSC_KEY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing protected secret: $name"
            }
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Windows source and native boundary
        run: npm run check
      - name: Build signed Windows update
        shell: powershell
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          npm run build:windows-hello
          npx --no-install electron-builder --win nsis zip --x64 --publish never -c.forceCodeSigning=true -c.extraMetadata.amzApiUpdateChannel=publisher-signed-v1
      - name: Verify packaged Bridge and Authenticode signatures
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\verify-windows-package.ps1 -SignatureMode Signed
          signtool verify /pa /v release\win-unpacked\AMZ.API.exe
          signtool verify /pa /v release\AMZ.API-Notebook-Key-Windows-x64-Setup.exe
          if (-not (Test-Path -LiteralPath release\latest.yml -PathType Leaf)) {
            throw "Windows updater metadata is missing."
          }
      - name: Record Windows checksums
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in @(".exe", ".zip") } | Sort-Object Name
          $lines = foreach ($file in $files) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant(), $file.Name
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD "release\SHA256SUMS-Windows.txt"), $lines)
      - name: Upload verified Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-windows
          path: |
            release/AMZ.API-Notebook-Key-Windows-x64-Setup.exe
            release/AMZ.API-Notebook-Key-Windows-x64.zip
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified desktop release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Download verified macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-release-macos
          path: release-assets/macos
      - name: Download verified Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-release-windows
          path: release-assets/windows
      - name: Verify complete updater payload
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/macos/latest-mac.yml
          test -f release-assets/windows/latest.yml
          test -n "$(find release-assets/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release-assets/macos -maxdepth 1 -name '*.zip' -print -quit)"
          test -f release-assets/windows/AMZ.API-Notebook-Key-Windows-x64-Setup.exe
          test -f release-assets/windows/AMZ.API-Notebook-Key-Windows-x64.zip
          find release-assets -type f ! -name 'SHA256SUMS-*' -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Publish verified desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_DESKTOP_UPDATE_FEED: ${{ vars.PUBLIC_DESKTOP_UPDATE_FEED }}
        run: |
          set -euo pipefail
          test "$PUBLIC_DESKTOP_UPDATE_FEED" = approved || { echo "::error::Public desktop update feed is not explicitly approved."; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo "::error::A published release already exists for this tag."; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "AMZ.API $GITHUB_REF_NAME" --notes "Publisher-signed AMZ.API Notebook Key update for macOS and Windows."
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/macos/* release-assets/windows/* release-assets/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
