name: Compact charts and dark readability verification
on:
  push:
    branches: [fix/compact-charts-dark-readability]
    paths: [.chart-ui.patch, .github/workflows/chart-ui-preview.yml]
permissions:
  contents: write
concurrency:
  group: chart-ui-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Archive current source for isolated review
        run: |
          mkdir -p chart-evidence
          git archive HEAD | gzip > chart-evidence/source.tar.gz
          git rev-parse HEAD > chart-evidence/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chart-ui-source
          path: chart-evidence/source*
          retention-days: 1
      - name: Apply reviewed renderer patch
        if: hashFiles('.chart-ui.patch') != ''
        run: git apply --check .chart-ui.patch && git apply --index .chart-ui.patch && git diff --cached --check
      - run: npm ci --ignore-scripts
        if: hashFiles('.chart-ui.patch') != ''
      - name: Production audit
        if: hashFiles('.chart-ui.patch') != ''
        run: npm audit --omit=dev > chart-evidence/audit.txt
      - name: Typecheck tests and production build
        if: hashFiles('.chart-ui.patch') != ''
        run: npm run check > chart-evidence/check.txt 2>&1
      - name: Isolated production browser checks
        if: hashFiles('.chart-ui.patch') != ''
        run: |
          npm install --prefix /tmp/chart-browser --no-save --ignore-scripts playwright@1.55.1
          APPEARANCE_PLAYWRIGHT=/tmp/chart-browser/node_modules/playwright/index.mjs node scripts/visual-qa/appearance-check.mjs > chart-evidence/browser.txt 2>&1
      - name: Store verified blobs without changing branches
        if: hashFiles('.chart-ui.patch') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs'), cp = require('child_process');
            const paths = cp.execFileSync('git',['diff','--cached','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const entries=[];
            for (const path of paths) {
              if (!/^(src\/renderer\/|tests\/|scripts\/|docs\/)/.test(path)) throw new Error('Unexpected patch path: '+path);
              const content=fs.readFileSync(path);
              const result=await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'});
              entries.push({path,mode:'100644',type:'blob',sha:result.data.sha});
            }
            fs.writeFileSync('chart-evidence/tree.json',JSON.stringify({verifiedSource:context.sha,entries},null,2));
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.chart-ui.patch') != ''
        with:
          name: chart-ui-verification
          path: |
            chart-evidence/*.txt
            chart-evidence/tree.json
            out/renderer
            appearance-evidence
          retention-days: 1
