name: Audit detail preview verification
on:
  push:
    branches: [feat/audit-detail-reading-system]
    paths: [.audit-detail.patch, .audit-detail-files.json, .github/workflows/audit-detail-preview.yml]
permissions:
  contents: write
concurrency:
  group: audit-detail-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply and verify exact reviewed source
        run: |
          mkdir -p audit-detail-evidence
          echo 'e438b045fb7a4a295c5760ad71417d675885861b8f1d6fcbf5dee3a654541bc9  .audit-detail.patch' | sha256sum -c
          git apply --check .audit-detail.patch
          git apply --index .audit-detail.patch
          git diff --cached --check
          python3 - <<'PY'
          import hashlib, json, pathlib
          for path, expected in json.loads(pathlib.Path('.audit-detail-files.json').read_text()).items():
              data = pathlib.Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, (path, actual, expected)
          print('All 14 reviewed implementation blobs match.')
          PY
      - run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm audit --omit=dev > audit-detail-evidence/audit.txt
      - name: Typecheck, tests and production build
        run: npm run check > audit-detail-evidence/check.txt 2>&1
      - name: Production browser checks with synthetic loopback data only
        run: |
          npm install --prefix /tmp/audit-browser --no-save --ignore-scripts playwright@1.55.1
          APPEARANCE_PLAYWRIGHT=/tmp/audit-browser/node_modules/playwright/index.mjs node scripts/visual-qa/appearance-check.mjs > audit-detail-evidence/browser.txt 2>&1
      - name: Store verified blobs without changing branch refs
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const expected = JSON.parse(fs.readFileSync('.audit-detail-files.json','utf8'));
            const entries = [];
            for (const [path, sha] of Object.entries(expected)) {
              if (!/^(src\/renderer\/|tests\/|scripts\/|docs\/)/.test(path)) throw new Error('Unexpected path: ' + path);
              const content = fs.readFileSync(path);
              const result = await github.rest.git.createBlob({...context.repo, content:content.toString('base64'), encoding:'base64'});
              if (result.data.sha !== sha) throw new Error('Blob mismatch: '+path);
              entries.push({path, mode:'100644', type:'blob', sha});
            }
            fs.writeFileSync('audit-detail-evidence/tree.json', JSON.stringify({verifiedSource:context.sha, entries}, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-detail-verification
          path: |
            audit-detail-evidence
            out/renderer
            appearance-evidence
          retention-days: 1
