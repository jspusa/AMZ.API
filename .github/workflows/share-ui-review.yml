name: Share chart UI review
on:
  push:
    branches: [fix/share-chart-hover-pink-controls]
    paths: [.share-ui.patch, .github/workflows/share-ui-review.yml]
permissions:
  contents: write
concurrency:
  group: share-ui-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed renderer patch
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, pathlib, zlib
          encoded = pathlib.Path('.share-ui.patch').read_text()
          for old, new in [('1WDfctp', '1WDctp'), ('cbZZ/h', 'cbZ/h'), ('XtV+7s7W9/YXlf', 'XtV+7s797Y3lf'), ('Fu9PrdtQ', 'Fu9DpdtQ')]:
              encoded = encoded.replace(old, new)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '15b4b6a8572d944424a88f7484d7d112063bd2054385466a0aef63263302c2d9'
          pathlib.Path('/tmp/share-reviewed.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/share-reviewed.patch
          git apply --index /tmp/share-reviewed.patch
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Production audit and full check
        run: |
          mkdir -p share-evidence
          npm audit --omit=dev > share-evidence/audit.txt
          npm run check > share-evidence/check.txt 2>&1
      - name: Synthetic loopback browser checks
        run: |
          npm install --prefix /tmp/share-browser --no-save --ignore-scripts playwright@1.55.1
          APPEARANCE_PLAYWRIGHT=/tmp/share-browser/node_modules/playwright/index.mjs node scripts/visual-qa/appearance-check.mjs > share-evidence/browser.txt 2>&1
      - name: Store verified source blobs without moving refs
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs'), cp = require('child_process');
            const paths = cp.execFileSync('git',['diff','--cached','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const entries=[];
            for (const path of paths) {
              if (!/^(src\/renderer\/|tests\/|scripts\/|docs\/)/.test(path)) throw new Error('Unexpected path: '+path);
              const bytes=fs.readFileSync(path);
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              entries.push({path,mode:'100644',type:'blob',sha:data.sha});
            }
            fs.writeFileSync('share-evidence/tree.json',JSON.stringify({verifiedSource:context.sha,entries},null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-ui-verification
          path: |
            share-evidence
            out/renderer
            appearance-evidence
          retention-days: 1
