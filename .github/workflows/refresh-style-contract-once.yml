name: Refresh stylesheet contract once

on:
  push:
    branches:
      - fix/share-readability-audit-hover

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/share-readability-audit-hover
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate authored dark palette
        run: npm run generate:appearance
      - name: Derive current stylesheet fingerprint
        shell: bash
        run: |
          set +e
          OUTPUT=$(npx vitest run tests/css01-stylesheet-composition.test.ts 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT" | tee css01-output.txt
          if [ "$STATUS" -ne 0 ]; then
            HASH=$(printf '%s\n' "$OUTPUT" | grep -Eo 'received [a-f0-9]{64}' | head -n 1 | awk '{print $2}')
            if ! printf '%s' "$HASH" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "Could not derive stylesheet fingerprint from focused contract failure." >&2
              exit 1
            fi
            printf '%s\n' "$HASH" > derived-fingerprint.txt
            HASH="$HASH" node -e 'const fs=require("node:fs"); const p="scripts/renderer-stylesheet-contract.mjs"; let s=fs.readFileSync(p,"utf8"); const h=process.env.HASH; s=s.replace(/fingerprint:\s*\n\s*"[a-f0-9]{64}"/u, `fingerprint:\n    "${h}"`); fs.writeFileSync(p,s);'
          fi
      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          npm run check > amz-check.log 2>&1
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > check-status.txt
          tail -n 400 amz-check.log > ci-style-debug.txt
          cat ci-style-debug.txt
      - name: Export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stylesheet-diagnostics
          path: |
            amz-check.log
            ci-style-debug.txt
            check-status.txt
            css01-output.txt
            derived-fingerprint.txt
            scripts/renderer-stylesheet-contract.mjs
            src/renderer/src/styles/dark-palette.generated.css
          if-no-files-found: warn
