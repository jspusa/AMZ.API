name: Release signed macOS app

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15-intel
    timeout-minutes: 90
    environment: mac-release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate tag and protected secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "::error::Tag must equal $expected"; exit 1; }
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "::error::Missing protected secret: $key"; exit 1; }
          done
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Sign, notarize and upload draft release
        run: >
          npx --no-install electron-builder
          --mac dmg zip
          --universal
          --publish always
          -c.forceCodeSigning=true
          -c.mac.notarize=true
        env:
          GH_TOKEN: ${{ github.token }}
          EP_DRAFT: "true"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify signature, notarization and architectures
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name 'AMZ.API.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          lipo -info "$app_path/Contents/MacOS/$executable" | tee /tmp/lipo-result
          grep -q x86_64 /tmp/lipo-result
          grep -q arm64 /tmp/lipo-result
      - name: Publish checksums
        run: |
          shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish verified release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
