name: Usability preview verification
on:
  push:
    branches: [feat/renderer-usability-polish]
    paths: [.ux.patch, .github/workflows/ux-verify.yml]
permissions:
  contents: write
concurrency:
  group: usability-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed frontend patch
        if: hashFiles('.ux.patch') != ''
        run: git apply --index .ux.patch && git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Archive source and locked build dependencies for isolated review
        run: |
          mkdir -p ux-evidence
          tar -czf ux-evidence/source.tar.gz src scripts tests docs package.json package-lock.json electron.vite.config.ts tsconfig.json AGENTS.md CONTEXT.md SECURITY.md README.md .gitignore .gitattributes .github build native launcher
          tar -czf ux-evidence/deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: ux-workbench
          path: ux-evidence/*.tar.gz
          retention-days: 1
      - name: Check production dependencies
        run: npm audit --omit=dev > ux-evidence/audit.txt
      - name: Typecheck, test and build exact patched source
        if: hashFiles('.ux.patch') != ''
        run: npm run check > ux-evidence/check.txt 2>&1
      - name: Browser harness
        if: hashFiles('.ux.patch') != ''
        run: |
          npm install --prefix /tmp/ux-browser --no-save --ignore-scripts playwright@1.55.1
          APPEARANCE_PLAYWRIGHT=/tmp/ux-browser/node_modules/playwright/index.mjs node scripts/visual-qa/appearance-check.mjs > ux-evidence/browser.txt 2>&1
      - name: Store verified blobs without changing any branch
        if: hashFiles('.ux.patch') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
            const entries = [];
            for (const path of paths) {
              if (!/^(src\/renderer\/|tests\/|scripts\/|docs\/)/.test(path)) throw new Error('Non-frontend patch path: ' + path);
              const content = fs.readFileSync(path);
              const result = await github.rest.git.createBlob({...context.repo, content:content.toString('base64'), encoding:'base64'});
              entries.push({path, mode:'100644', type:'blob', sha:result.data.sha});
            }
            fs.writeFileSync('ux-evidence/tree.json', JSON.stringify({verifiedSource:context.sha, entries}, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-verification
          path: |
            ux-evidence/*.txt
            ux-evidence/tree.json
            out/renderer
            appearance-evidence
          retention-days: 1
