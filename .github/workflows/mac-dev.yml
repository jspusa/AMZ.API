name: Build unsigned macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "electron.vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/mac-dev.yml"

permissions:
  contents: read

concurrency:
  group: mac-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Package unsigned universal test build
        run: >
          npx --no-install electron-builder
          --mac dmg zip
          --universal
          --publish never
          -c.mac.identity=null
          -c.mac.hardenedRuntime=false
          -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Record checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt
      - name: Upload internal test installer
        uses: actions/upload-artifact@v7
        with:
          name: AMZ.API-unsigned-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
