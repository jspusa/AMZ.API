name: Build unsigned macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/main/**"
      - "src/preload/**"
      - "src/shared/**"
      - "build/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "electron.vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/mac-dev.yml"

permissions:
  contents: read

concurrency:
  group: mac-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Package universal test app
        run: >
          npx --no-install electron-builder
          --mac dir
          --universal
          --publish never
          -c.mac.identity=null
          -c.mac.hardenedRuntime=false
          -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Ad-hoc sign and verify test app
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name 'AMZ.API.app' -print -quit)"
          test -n "$app_path"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          smoke_log="$(mktemp)"
          "$app_path/Contents/MacOS/$executable" >"$smoke_log" 2>&1 &
          app_pid="$!"
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$smoke_log"
            wait "$app_pid"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Create test DMG and ZIP
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app_path="$(find release -type d -name 'AMZ.API.app' -print -quit)"
          stage="$(mktemp -d)"
          cp -R "$app_path" "$stage/AMZ.API.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "AMZ.API $version" -srcfolder "$stage" -ov -format UDZO "release/AMZ.API-$version-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release/AMZ.API-$version-universal.zip"
      - name: Record checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt
      - name: Upload internal test installer
        uses: actions/upload-artifact@v7
        with:
          name: AMZ.API-unsigned-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
