name: Frontend efficiency isolated review
on:
  push:
    branches: [feature/frontend-workflow-efficiency]
permissions:
  contents: write
concurrency:
  group: frontend-efficiency-materialization
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Materialize hash-verified source and regression tests
        run: |
          node .github/finish-efficiency.mjs
          git add electron.vite.config.ts src/renderer scripts/renderer-stylesheet-contract.mjs scripts/visual-qa/workflow-efficiency-fixture.js scripts/visual-qa/workflow-efficiency-check.mjs tests docs/releases/2026-09-frontend-workflow-efficiency.md docs/specs/2026-09-frontend-workflow-efficiency.md
          git diff --cached --check
          git diff --cached --stat
      - name: Validate exact frontend source
        run: |
          set -o pipefail
          npm run check 2>&1 | tee frontend-check.log
      - name: Audit production dependencies
        run: |
          set -o pipefail
          npm audit --omit=dev 2>&1 | tee frontend-audit.log
      - name: Isolated production-bundle browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/frontend-qa" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          export APPEARANCE_PLAYWRIGHT="$RUNNER_TEMP/frontend-qa/node_modules/playwright/index.mjs"
          export APPEARANCE_CHROME="$(command -v google-chrome || command -v chromium)"
          set -o pipefail
          node scripts/visual-qa/workflow-efficiency-check.mjs 2>&1 | tee frontend-browser.log
      - name: Commit verified source to the feature branch only
        run: |
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(ui): add exact batch filters, session navigation and loaded build information"
          git push origin HEAD:feature/frontend-workflow-efficiency
          git rev-parse HEAD > verified-source-sha.txt
          git archive --format=tar.gz HEAD > verified-source.tar.gz
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-efficiency-verified
          path: |
            frontend-check.log
            frontend-audit.log
            frontend-browser.log
            workflow-evidence
            verified-source-sha.txt
            verified-source.tar.gz
            out/renderer
          retention-days: 5
