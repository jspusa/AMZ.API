name: Deploy AMZ.API control console

on:
  push:
    branches: [main]
    paths:
      - "src/renderer/**"
      - "src/shared/**"
      - "electron.vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build GitHub control console
        run: npm run build
      - name: Upload control console
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/renderer
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
