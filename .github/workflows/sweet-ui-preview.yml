name: Sweet pink and content UI verification
on:
  push:
    branches: [fix/sweet-pink-content-audit]
    paths: [.sweet-ui.patch, .github/workflows/sweet-ui-preview.yml]
permissions:
  contents: write
concurrency:
  group: sweet-ui-preview
  cancel-in-progress: true
jobs:
  preview:
    if: contains(github.event.head_commit.message, 'verify reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed UI patches
        run: |
          mkdir -p ui-evidence
          git apply --check .sweet-patch-1 .sweet-patch-2 .sweet-patch-3 .sweet-patch-4 .sweet-patch-5
          git apply --index .sweet-patch-1 .sweet-patch-2 .sweet-patch-3 .sweet-patch-4 .sweet-patch-5
          git diff --cached --check
          python3 - <<'PY'
          import hashlib,json,pathlib
          for path, expected in json.loads(pathlib.Path('.sweet-ui.patch').read_text()).items():
              data=pathlib.Path(path).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==expected, (path,actual,expected)
          print('All reviewed implementation file hashes match.')
          PY
      - run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm audit --omit=dev > ui-evidence/audit.txt
      - name: Typecheck, tests and production build
        run: npm run check > ui-evidence/check.txt 2>&1
      - name: Isolated production browser verification
        run: |
          npm install --prefix /tmp/ui-browser --no-save --ignore-scripts playwright@1.55.1
          APPEARANCE_PLAYWRIGHT=/tmp/ui-browser/node_modules/playwright/index.mjs node scripts/visual-qa/appearance-check.mjs > ui-evidence/browser.txt 2>&1
      - name: Store verified blobs without changing branch refs
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const paths = cp.execFileSync('git', ['diff','--cached','--name-only','-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
            const entries = [];
            for (const path of paths) {
              if (!/^(src\/renderer\/|tests\/|scripts\/|docs\/)/.test(path)) throw new Error('Unexpected patch path: '+path);
              const content = fs.readFileSync(path);
              const result = await github.rest.git.createBlob({...context.repo, content:content.toString('base64'), encoding:'base64'});
              entries.push({path,mode:'100644',type:'blob',sha:result.data.sha});
            }
            fs.writeFileSync('ui-evidence/tree.json', JSON.stringify({verifiedSource:context.sha, entries},null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweet-ui-verification
          path: |
            ui-evidence
            out/renderer
            appearance-evidence
          retention-days: 1
