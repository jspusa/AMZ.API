name: Appearance preview verification
on:
  push:
    branches: [feature/pink-dark-appearance]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive exact public source for isolated visual inspection
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-source
          path: source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependency audit evidence
        run: npm audit --omit=dev --json > audit-production.json || true
      - name: Validate source and production build
        run: npm run check
      - name: Install isolated browser harness
        run: npm install --prefix "$RUNNER_TEMP/appearance-browser" --no-save --package-lock=false playwright@1.56.1
      - name: Verify production UI with synthetic local data
        env:
          APPEARANCE_PLAYWRIGHT: ${{ runner.temp }}/appearance-browser/node_modules/playwright/index.mjs
        run: node scripts/visual-qa/appearance-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-preview
          path: |
            out/renderer
            audit-production.json
            appearance-evidence
          retention-days: 1
