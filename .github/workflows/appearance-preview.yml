name: Appearance preview verification
on:
  push:
    branches: [feature/pink-dark-appearance]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive exact public source for isolated visual inspection
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-source
          path: source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependency audit evidence
        run: npm audit --omit=dev --json > audit-production.json || true
      - name: Validate source and production build
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-preview
          path: |
            out/renderer
            audit-production.json
          retention-days: 1
